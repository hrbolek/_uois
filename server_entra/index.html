    <script type="text/babel" data-type="module" data-presets="react">
        import React, {
            useEffect,
            useMemo,
            useRef,

        import { createRoot } from "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm";

            BrowserRouter,
            Link,
            Routes,
            Route,
            useParams
        } from "https://cdn.jsdelivr.net/npm/react-router-dom@6.26.2/+esm";

        import { marked } from "https://cdn.jsdelivr.net/npm/marked@14.1.2/+esm";
        import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.1.6/+esm";

        const debugData = JSON.parse(
            document.getElementById("debug-data").textContent
        );

        const nestedApps = globalThis.nestedApps || {};

        function MarkdownBlock({ md }) {
            const html = useMemo(() => {
                const rawHtml = marked.parse(md || "");
                return DOMPurify.sanitize(rawHtml);
            }, [md]);

            return (
                <div
                    className="markdown-content"
                    dangerouslySetInnerHTML={{ __html: html }}
                />
            );
        }

        function ensureStylesheet(href) {
            if (!href) return;

            const existing = document.querySelector(
                `link[data-dynamic-css="${CSS.escape(href)}"]`
            );

            if (existing) return;

            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.crossOrigin = "anonymous";
            link.href = href;
            link.dataset.dynamicCss = href;

            document.head.appendChild(link);
        }

        function ensureStylesheets(hrefs) {
            if (!hrefs) return;

            const list = Array.isArray(hrefs) ? hrefs : [hrefs];

            for (const href of list) {
                ensureStylesheet(href);
            }
        }

        function getNestedAppEntries() {
            return Object.entries(nestedApps).map(([appKey, config]) => ({
                appKey,
                ...config,
                basePath: config.basePath || `/${appKey}`
            }));
        }

        function LayoutDescription() {

                    {debugData.appTitle || "Easy Entra ID → Apollo Bridge"}

            </div>
            );
        }

        }

        function NestedAppsOverviewPage() {

        function DebugPage() {
            const pretty = useMemo(() => JSON.stringify(debugData, null, 2), []);

            return (
                <Layout>
                    <div className="row g-3">

                                    <dd><code>{debugData.cookieName}</code></dd>
                                </dl>
                            </div>
                        </div>

                        <div className="col-lg-8">

        }

        function GraphQLTestPage() {
            const [query, setQuery] = useState(`query {\n  userPage { __typename id email }\n}`);
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);

            async function runQuery() {
                setLoading(true);
                setResult("");

                try {
                    const response = await fetch("/api/gql", {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "content-type": "application/json"
                        },
                        body: JSON.stringify({ query })
                    });

                    const data = await response.json();
                    setResult(`HTTP ${response.status}\n\n${JSON.stringify(data, null, 2)}`);
                } catch (e) {
                    setResult(String(e));
                } finally {
                    setLoading(false);
                }
            }

            return (
                <Layout>
                    <div className="card p-3">
                        <h2 className="h5">GraphQL test</h2>

                        <p className="text-muted">
                            Tento formulář volá <code>POST /api/gql</code>. Bridge z Entra hlaviček vytvoří interní JWT
                            a požadavek předá do Apollo.
                        </p>

                        <textarea
                            className="form-control bg-dark text-light border-secondary"
                            rows="8"
                            value={query}
                            onChange={e => setQuery(e.target.value)}
                        />

                        <div className="mt-3">
                            <button className="btn btn-primary" onClick={runQuery} disabled={loading}>
                                {loading ? "Volám Apollo..." : "Spustit query"}
                            </button>
                        </div>

                        {result && <pre className="mt-3">{result}</pre>}
                    </div>
                </Layout>
            );
        }

        function NestedAppDescription() {

                    <h2 className="h5 mb-1">{appConfig.title || appKey}</h2>

                    </p>

        }

        function AboutPage() {
            return (
                <Layout>
                    <div className="card p-3">
                        <h2 className="h5">About</h2>
                        <p className="text-muted">
                            Tento debug UI je jednoduchá React aplikace načítaná z jednoho HTML souboru. Backend neposkytuje žádné API kromě GraphQL endpointu, který slouží jako bridge do Apollo serveru.
                        </p>

                        <p className="text-muted">
                            Cílem je mít snadno dostupný nástroj pro testování a ladění integrace Entra ID → Apollo Bridge bez nutnosti spouštět komplexní frontendové frameworky nebo build procesy.
                        </p>
                    </div>
                </Layout>
            );
        }

        function NestedAppPage({ appKey = "ug" }) {

            const mountRef = useRef(null);
            const moduleRef = useRef(null);

            const [error, setError] = useState("");
            const [loading, setLoading] = useState(true);

            const appConfig = nestedApps[appKey];

            useEffect(() => {
                let cancelled = false;

                async function loadAndMount() {
                    setLoading(true);
                    setError("");

                    if (!appConfig) {
                        setLoading(false);
                        setError(`Neznámá vnořená aplikace: ${appKey || "—"}`);
                        return;
                    }

                    try {
                        ensureStylesheets(appConfig.css);

                        const module = await import(appConfig.script);

                        if (cancelled) return;

                        moduleRef.current = module;

                        const mountExportName = appConfig.mountExport || "mount";
                        const mount = module[mountExportName];

                        if (typeof mount !== "function") {
                            throw new Error(
                                `Modul ${appConfig.script} neexportuje funkci ${mountExportName}(...).`
                            );
                        }

                        const mountOptions = {
                            GQLENDPOINT: "/api/gql",
                            ...(appConfig.mountOptions || {}),
                            debugData
                        };

                        mount(mountRef.current, mountOptions);
                    } catch (e) {
                        console.error(e);
                        setError(String(e));
                    } finally {
                        if (!cancelled) {
                            setLoading(false);
                        }
                    }
                }

                loadAndMount();

                return () => {
                    cancelled = true;

                    const module = moduleRef.current;

                    if (module && appConfig) {
                        const unmountExportName = appConfig.unmountExport || "unmount";
                        const unmount = module[unmountExportName];

                        if (typeof unmount === "function" && mountRef.current) {
                            try {
                                unmount(mountRef.current);
                            } catch (e) {
                                console.warn("Unmount vnořené aplikace selhal:", e);
                            }
                        }
                    }

                    if (mountRef.current) {
                        mountRef.current.innerHTML = "";
                    }

                    moduleRef.current = null;
                };
            }, [appKey]);



            if (!appConfig) {
                return (
                    <Layout>
                        <div className="card p-3">
                            <h2 className="h5">Neznámá aplikace {appKey} XX</h2>
                            <pre>{error || `Nenalezena konfigurace pro: ${appKey || "—"}`}</pre>
                        </div>
                    </Layout>
                );
            }

            return (
                <Layout>
                    <div>
                        <div className="d-flex justify-content-between align-items-start gap-3 mb-3">


                            {loading && (
                                <span className="badge text-bg-primary">
                                    Načítám...
                                </span>
                            )}
                        </div>

                        {error && (
                            <pre className="mt-3 text-danger">{error}</pre>
                        )}

                        <div className="nested-app-container">
                            <div ref={mountRef}></div>
                        </div>
                    </div>
                </Layout>
            );
        }

        function App() {
            const appEntries = getNestedAppEntries();

            return (
                <BrowserRouter>
                    <Routes>
                        <Route path="/Debug" element={<DebugPage />} />
                        <Route path="/graphql-test" element={<GraphQLTestPage />} />
                        <Route path="/apps" element={<NestedAppsOverviewPage />} />
                        <Route path="/index" element={<NestedAppsOverviewPage />} />
                        <Route path="/About" element={<AboutPage />} />
                        {appEntries.map(app => (
                            <Route
                                key={app.appKey}
                                path={`${app.basePath}/*`}
                                element={<NestedAppPage appKey={app.appKey} />}
                            />
                        ))}

                        <Route path="/:appKey/*" element={<NestedAppPage />} />

                        <Route path="*" element={<DebugPage />} />
                    </Routes>
                </BrowserRouter>
            );
        }

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
