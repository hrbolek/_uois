<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Easy Entra ID → Apollo Bridge Debug</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <style>
    body {
      background: #0b1020;
      color: #e8eefc;
    }
    .card {
      background: #121a33;
      border: 1px solid #24345f;
    }
    .text-muted {
      color: #93a4c7 !important;
    }
    pre {
      background: #050816;
      color: #d8e6ff;
      border: 1px solid #1e2a4d;
      border-radius: 0.5rem;
      padding: 1rem;
      max-height: 55vh;
      overflow: auto;
    }
    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    code {
      color: #8bd3ff;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script id="debug-data" type="application/json">"__DEBUG_DATA_PLACEHOLDER__"</script>

  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, {useMemo, useState} from "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm";
    import {createRoot} from "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm";
    import {
      BrowserRouter,
      Link,
      Routes,
      Route
    } from "https://cdn.jsdelivr.net/npm/react-router-dom@6.26.2/+esm";

    const debugData = JSON.parse(
      document.getElementById("debug-data").textContent
    );

    function Layout({children}) {
      return (
        <main className="container py-4">
          <header className="mb-4">
            <h1 className="display-6">{debugData.appTitle || "Easy Entra ID → Apollo Bridge"}</h1>
            <p className="text-muted mb-2">
              Single-page debug UI. Backend obsluhuje pouze <code>POST /api/gql</code> jako bridge do Apollo.
            </p>
            <nav className="d-flex gap-3">
              <Link to="/">Debug</Link>
              <Link to="/graphql-test">GraphQL test</Link>
              <a href="/health">Health JSON</a>
              <a href="/oauth/publickey">OAuth public key</a>
            </nav>
          </header>
          {children}
        </main>
      );
    }

    function DebugPage() {
      const pretty = useMemo(() => JSON.stringify(debugData, null, 2), []);

      return (
        <Layout>
          <div className="row g-3">
            <div className="col-lg-4">
              <div className="card p-3 h-100">
                <h2 className="h5">Stav</h2>
                <dl>
                  <dt>Autentizace</dt>
                  <dd>{debugData.authState}</dd>

                  <dt>Lokální uživatel</dt>
                  <dd>{debugData.localUser?.email || debugData.localUser?.id || "—"}</dd>

                  <dt>Apollo endpoint</dt>
                  <dd><code>{debugData.apolloGqlUrl}</code></dd>

                  <dt>Cookie</dt>
                  <dd><code>{debugData.cookieName}</code></dd>
                </dl>
              </div>
            </div>

            <div className="col-lg-8">
              <div className="card p-3">
                <h2 className="h5">Debug payload</h2>
                <pre>{pretty}</pre>
              </div>
            </div>
          </div>
        </Layout>
      );
    }

    function GraphQLTestPage() {
      const [query, setQuery] = useState(`query {\n  userPage { __typename id email }\n}`);
      const [result, setResult] = useState("");
      const [loading, setLoading] = useState(false);

      async function runQuery() {
        setLoading(true);
        setResult("");

        try {
          const response = await fetch("/api/gql", {
            method: "POST",
            credentials: "include",
            headers: {
              "content-type": "application/json"
            },
            body: JSON.stringify({query})
          });

        //   const text = await response.text();
          const data = await response.json();
          setResult(`HTTP ${response.status}\n\n${JSON.stringify(data, null, 2)}`);
        //   setResult(`HTTP ${response.status}\n\n${text}`);
        } catch (e) {
          setResult(String(e));
        } finally {
          setLoading(false);
        }
      }

      return (
        <Layout>
          <div className="card p-3">
            <h2 className="h5">GraphQL test</h2>
            <p className="text-muted">
              Tento formulář volá <code>POST /api/gql</code>. Bridge z Entra hlaviček vytvoří interní JWT
              a požadavek předá do Apollo.
            </p>

            <textarea
              className="form-control bg-dark text-light border-secondary"
              rows="8"
              value={query}
              onChange={e => setQuery(e.target.value)}
            />

            <div className="mt-3">
              <button className="btn btn-primary" onClick={runQuery} disabled={loading}>
                {loading ? "Volám Apollo..." : "Spustit query"}
              </button>
            </div>

            {result && <pre className="mt-3">{result}</pre>}
          </div>
        </Layout>
      );
    }

    function App() {
      return (
        <BrowserRouter>
          <Routes>
            <Route path="/" element={<DebugPage />} />
            <Route path="/graphql-test" element={<GraphQLTestPage />} />
            <Route path="*" element={<DebugPage />} />
          </Routes>
        </BrowserRouter>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
